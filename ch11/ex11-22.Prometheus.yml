global:
  # 스크레이핑 주기를 15초로 설정. 기본값은 1분
  scrape_interval:     15s
  # 규칙을 1초 마다 평가. 기본값은 1분
  evaluation_interval: 15s
  # scrape_timeout은 전역 기본값인 10초로 설정되어 있음

# ...

scrape_configs:

- job_name: prometheus
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - localhost:9090

- job_name: animal
  metrics_path: /actuator/prometheus
  scrape_interval: 5s
  static_configs:
    - targets:
      - animal-service:8080

# 다른 서비스들도 유사하게 구성되어 있음